name: tests

on:
    pull_request:
    push:
        branches:
            - master
            - develop
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: tests-${{ github.ref }}
    cancel-in-progress: true

jobs:
    js:
        name: JS
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v6

            - name: Setup Node
              uses: actions/setup-node@v6
              with:
                  node-version: 22
                  cache: npm

            - name: Install JS dependencies
              run: npm ci

            - name: Check types
              run: npm run typecheck

            - name: Run linting
              run: npm run lint

    php:
        name: Laravel ${{ matrix.laravel }} on PHP ${{ matrix.php }}
        runs-on: ubuntu-latest
        strategy:
            fail-fast: true
            matrix:
                php: [8.2, 8.3, 8.4, 8.5]
                laravel: [11, 12, 13]
                exclude:
                    - php: 8.5
                      laravel: 11
                    - php: 8.2
                      laravel: 13

        steps:
            - name: Checkout code
              uses: actions/checkout@v6

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ matrix.php }}
                  extensions: dom, curl, libxml, mbstring, zip
                  tools: composer:v2
                  coverage: none

            - name: Cache Composer dependencies
              uses: actions/cache@v5
              with:
                  path: vendor
                  key: ${{ runner.os }}-php-${{ matrix.php }}-laravel-${{ matrix.laravel }}-${{ hashFiles('composer.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-php-${{ matrix.php }}-laravel-${{ matrix.laravel }}-

            - name: Install PHP dependencies
              run: composer update --prefer-dist --no-interaction --no-progress --with="illuminate/contracts=^${{ matrix.laravel }}"

            - name: Run tests
              run: vendor/bin/pest --parallel --compact

name: tests

on:
  pull_request:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:

    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.2'
            laravel: '^11.0'
            testbench: '^9.15'
            dependency-flags: '--prefer-lowest'
          - php: '8.3'
            laravel: '^12.0'
            testbench: '^10.8'
            dependency-flags: ''
          - php: '8.4'
            laravel: '^13.0'
            testbench: '^11.0'
            dependency-flags: ''

    name: Laravel ${{ matrix.laravel }} on PHP ${{ matrix.php }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip
          tools: composer:v2
          coverage: none
          cache: composer

      - name: Install dependencies
        run: |
          composer require "laravel/framework=${{ matrix.laravel }}" "orchestra/testbench=${{ matrix.testbench }}" --no-update
          composer update --prefer-dist --no-interaction --no-progress ${{ matrix.dependency-flags }}

      - name: Run tests
        run: vendor/bin/pest --parallel --compact

name: ci
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  js:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: bash bin/ci.sh js

  php:
    name: php (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: laravel-12
            php: '8.3'
            laravel: '12'
          - name: laravel-13
            php: '8.5'
            laravel: '13'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip
          tools: composer:v2
          coverage: none
      - name: Install Laravel 12
        if: matrix.laravel == '12'
        run: |
          composer require "orchestra/testbench:^10.8" --dev --no-update --no-interaction --no-progress
          composer update --no-interaction --no-progress --prefer-dist
          php -r '
          $lock = json_decode(file_get_contents("composer.lock"), true);
          $want = ["laravel/framework" => "v12.", "orchestra/testbench" => "v10."];
          $found = [];
          foreach (["packages", "packages-dev"] as $section) {
              foreach ($lock[$section] ?? [] as $package) {
                  if (isset($want[$package["name"]])) {
                      $found[$package["name"]] = $package["version"];
                  }
              }
          }
          foreach ($want as $name => $prefix) {
              $version = $found[$name] ?? "";
              if (!str_starts_with($version, $prefix)) {
                  fwrite(STDERR, "$name resolved to \"$version\", expected {$prefix}*\n");
                  exit(1);
              }
              echo "$name $version\n";
          }
          '
      - name: Install Laravel 13
        if: matrix.laravel == '13'
        run: composer install --no-interaction --no-progress
      - if: matrix.laravel == '12'
        run: bash bin/ci.sh php-test
      - if: matrix.laravel == '13'
        run: bash bin/ci.sh php

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Throwaway service containers. These credentials are not secrets.
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: canvas_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot"
          --health-interval=5s --health-timeout=5s --health-retries=20
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: canvas_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      DB_HOST: 127.0.0.1
      DB_DATABASE: canvas_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5'
          extensions: dom, curl, libxml, mbstring, zip, pdo_mysql, pdo_pgsql
          tools: composer:v2
          coverage: none
      - run: composer install --no-interaction --no-progress
      - name: MySQL
        env:
          DB_CONNECTION: mysql
          DB_PORT: '3306'
          DB_USERNAME: root
          DB_PASSWORD: ''
        run: composer test:database
      - name: Postgres
        env:
          DB_CONNECTION: pgsql
          DB_PORT: '5432'
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
        run: composer test:database

  install:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          extensions: dom, curl, libxml, mbstring, zip, sqlite3, pdo_sqlite, fileinfo
          tools: composer:v2
          coverage: none
      - run: bash bin/install-smoke.sh 12

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5'
          extensions: dom, curl, libxml, mbstring, zip, sqlite3, pdo_sqlite, fileinfo
          tools: composer:v2
          coverage: none
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install smoke host and Playwright
        env:
          E2E_HOST_DIR: ${{ runner.temp }}/canvas-e2e-host
        run: bash bin/ci.sh e2e
      - name: Upload results
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-results
          path: test-results
          retention-days: 5
          if-no-files-found: ignore

  ci:
    if: always()
    needs: [js, php, database, install, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "::error::A required job ended with: $result"
              exit 1
            fi
          done
